name: go test [monorepo]

permissions:
  contents: read
  pull-requests: read

on:
  workflow_call:
    inputs:
      extra-flags:
        description: extra flags to add to go test
        type: string
        required: false
      test-matrix:
        description: |
          Optional JSON string to define the test matrix, using keys: "os" and "go".

          By default tests run a 6-way matrix running on os (linux,windows,macos)
          for the 2 latest go releases (stable, oldstable).

          The default matrix used is:
          {"os":["ubuntu-latest","macos-latest","windows-latest"],"go": ["oldstable","stable"]}

        type: string
        required: false
      no-race:
        description: 'runs test without -race'
        type: string
        required: false
        default: 'false'
      timeout:
        description: 'test timeout'
        type: string
        required: false
        default: '30m'
      extra-paths:
        description: |
          Extra glob patterns, one per line, that mark a change as relevant to the tests.

          See the 'extra-paths' input of changed-paths.yml. Repositories with fixtures or a
          codegen configuration outside of the go sources want to declare them here.
        type: string
        required: false
        default: ''
      force-run:
        description: |
          Set to 'true' to run the full matrix whatever changed, bypassing changed-paths detection.

          Use it for scheduled or manually dispatched runs, and as the opt-out for repositories
          that do not want path-based skipping.
        type: string
        required: false
        default: 'false'

defaults:
  run:
    shell: bash

jobs:
  changes:
    # description: |
    #   Decide whether this run has anything to test. Fails open: anything unclear runs
    #   the whole suite. Skipped jobs cost no runner minute, but the workflow keeps
    #   reporting, so "tests completed" stays usable as a required status check.
    name: Changes
    uses: ./.github/workflows/changed-paths.yml
    with:
      preset: go
      extra-paths: ${{ inputs.extra-paths }}
      force: ${{ inputs.force-run }}

  lint:
    name: Lint
    needs: [changes]
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      is-monorepo: ${{ steps.detect-monorepo.outputs.is-monorepo }}
      bash-paths: ${{ steps.detect-monorepo.outputs.bash-paths }}
      bash-subpaths: ${{ steps.detect-monorepo.outputs.bash-subpaths }}
      module-names: ${{ steps.detect-monorepo.outputs.names }}
      coverpkg: ${{ steps.prepare-tests.outputs.coverpkg }}
      all-modules: ${{ steps.prepare-tests.outputs.all-modules }}
    steps:
      -
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      -
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: '**/go.sum'
      -
        name: Detect go mono-repo
        id: detect-monorepo
        uses: go-openapi/gh-actions/ci-jobs/detect-go-monorepo@22efe2037645eed0102229f2488f22aee042b2a4 # v1.4.18
      -
        name: golangci-lint [monorepo]
        # golangci-action v9.1+ has an experimental built-in mono repo detection setup.
        if: ${{ steps.detect-monorepo.outputs.is-monorepo == 'true' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          only-new-issues: true
          skip-cache: true
          experimental: "automatic-module-directories"
      -
        name: golangci-lint
        if: ${{ steps.detect-monorepo.outputs.is-monorepo != 'true' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          only-new-issues: true
          skip-cache: true
      -
        name: Prepare tests
        id: prepare-tests
        run: |
          coverpkg=$(echo '${{ steps.detect-monorepo.outputs.names }}' | jq -rc  '.[]|.+"/..."'|tr '\n' ','|head -c -1)
          echo "coverpkg=${coverpkg}" >> "${GITHUB_OUTPUT}"
          echo "::notice::title=coverpkg::${coverpkg}"

          declare -a ALL_MODULES
          ALL_MODULES=(${{ steps.detect-monorepo.outputs.bash-subpaths }}) # a bash array with all module folders, suffixed with "/..."
          echo "all-modules=${ALL_MODULES[@]}" >> "${GITHUB_OUTPUT}"
          echo "::notice::title=Modules found::${ALL_MODULES[@]}"

      # Carry out the linting the traditional way, within a shell loop
      #-
      #  name: Lint multiple modules
      #  if: ${{ steps.detect-monorepo.outputs.is-monorepo == 'true' }}
      #  # golangci-lint doesn't support go.work to lint multiple modules in one single pass
      #  run: |
      #    set -euxo pipefail
      #    git fetch origin master
      #    git show --no-patch --oneline origin/master
      #    while read -r module_location ; do
      #      pushd "${module_location}"
      #      golangci-lint run --new-from-rev origin/master
      #      popd
      #    done < <(echo ${{ steps.detect-monorepo.outputs.bash-paths }})

  test:
    name: Unit tests mono-repo
    needs: [changes, lint]
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Read straight from the inputs: routing it through a job output would make the
      # matrix depend on that job having run, and lint is now skippable.
      #
      # Mind the absence of a space after '"go":': a ": " sequence would end the plain
      # YAML scalar and the whole expression would fail to parse.
      matrix: ${{ fromJSON(inputs.test-matrix || '{"os":["ubuntu-latest","macos-latest","windows-latest"],"go":["oldstable","stable"]}') }}
    steps:
      -
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Ensure GOCACHE is created on windows runners
        # On windows, the github runner locates the GOROOT and GOCACHE on C:, whereas our
        # tests are executed on D:. We want to colocalize the cache.
        if: ${{ runner.os  == 'Windows' }}
        shell: bash
        env:
          BASE: ${{ github.workspace }}
        run: |
          mkdir -p ../.cache/go-build
          mkdir -p ../pkg/mod
          _base=$(cygpath -u "${BASE}")
          _gocache="$(realpath ${_base}/../.cache/go-build)"
          _modcache="$(realpath ${_base}/../pkg/mod)"
          GOCACHE=$(cygpath -w "${_gocache}")
          GOMODCACHE=$(cygpath -w "${_modcache}")
          #
          echo "GOCACHE=${GOCACHE}" >> "${GITHUB_ENV}"
          echo "GOMODCACHE=${GOMODCACHE}" >> "${GITHUB_ENV}"
          echo "::gocache::${GOCACHE}"
          echo "::gomodcache::${GOMODCACHE}"
      -
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go-setup
        with:
          go-version: '${{ matrix.go }}'
          check-latest: true
          cache: true
          cache-dependency-path: '**/go.sum'
      -
        name: Detect go version capabilities
        id: detect-go-version
        uses: go-openapi/gh-actions/ci-jobs/detect-go-version@22efe2037645eed0102229f2488f22aee042b2a4 # v1.4.18
      -
        name: Install gotestsum
        uses: go-openapi/gh-actions/install/gotestsum@22efe2037645eed0102229f2488f22aee042b2a4 # v1.4.18
      -
        name: Ensure TMP is created on windows runners
        # On windows, some tests require testing.TempDir to reside on the same drive as the code.
        # TMP is used by os.TempDir() to determine the location of temporary files.
        # This is in particular the case for all programs that use [filepath.Rel].
        if: ${{ runner.os  == 'Windows' }}
        shell: bash
        env:
          BASE: ${{ github.workspace }}
        run: |
          mkdir -p "${BASE}/../tmp"
          _base=$(cygpath -u "${BASE}")
          _tmp=$(realpath ${_base}/../tmp)
          TMP=$(cygpath -w "${_tmp}")
          #
          echo "TMP=${TMP}" >> "${GITHUB_ENV}"
          echo "::tmp::${TMP}"
      -
        name: Run unit tests on all modules (go1.25+ with go.work) [monorepo]
        if: ${{ needs.lint.outputs.is-monorepo == 'true' && steps.detect-go-version.outputs.is-gotestwork-supported == 'true' }}
        # with go.work file enabled, go test recognizes sub-modules and collects all packages to be covered
        # without specifying -coverpkg.
        #
        # However, cross-module test coverage is only reported with the appropriate -coverpkg setting.
        #
        # This requires:
        # * go.work properly initialized with use of all known modules
        # * go.work committed to git
        env:
          EXTRA_FLAGS: ${{ inputs.extra-flags }}
          WANTS_NORACE: ${{ inputs.no-race }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          RACEOPT="-race"
          if [[ "${WANTS_NORACE}" == "true" ]] ; then
            RACEOPT=""
          fi

          # ${RACEOPT} unquoted on purpose: quoted, an empty value passes '' as a package
          # pattern, and go test then runs nothing and still exits 0.
          gotestsum \
          --jsonfile 'unit.report.${{ matrix.os }}-${{ matrix.go }}.json' \
          -- \
          work \
          ${RACEOPT} \
          -p 2 \
          -count 1 \
          -timeout="${TIMEOUT}" \
          -coverprofile='unit.coverage.${{ matrix.os }}-${{ matrix.go }}.out' \
          -covermode=atomic \
          -coverpkg='${{ needs.lint.outputs.coverpkg }}' ${EXTRA_FLAGS} \
          ./...
      - 
        name: Run unit tests on all modules (<go1.25 or no go.work) [monorepo]
        # Mind the ">-" rather than ">": a plain fold scalar keeps a trailing newline, which
        # leaves characters around the ${{ }} and makes the whole condition a non-empty
        # string -- always true. This step used to run unconditionally, alongside the
        # go1.25 one on a monorepo.
        if: >-
          ${{
              needs.lint.outputs.is-monorepo == 'true' && steps.detect-go-version.outputs.is-gotestwork-supported != 'true'
          }}
        env:
          EXTRA_FLAGS: ${{ inputs.extra-flags }}
          ALL_MODULES: ${{ needs.lint.outputs.all-modules }}
          WANTS_NORACE: ${{ inputs.no-race }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          RACEOPT="-race"
          if [[ "${WANTS_NORACE}" == "true" ]] ; then
            RACEOPT=""
          fi

          # ${RACEOPT} unquoted on purpose -- see the note in the go.work step above.
          gotestsum \
          --jsonfile 'unit.report.${{ matrix.os }}-${{ matrix.go }}.json' \
          -- \
          ${RACEOPT} \
          -p 2 \
          -count 1 \
          -timeout="${TIMEOUT}" \
          -coverprofile='unit.coverage.${{ matrix.os }}-${{ matrix.go }}.out' \
          -covermode=atomic \
          -coverpkg='${{ needs.lint.outputs.coverpkg }}' ${EXTRA_FLAGS} \
          ${ALL_MODULES}
      -
        name: Run unit tests
        if: ${{ needs.lint.outputs.is-monorepo != 'true' }}
        env:
          EXTRA_FLAGS: ${{ inputs.extra-flags }}
        run: >
          gotestsum
          --jsonfile 'unit.report.${{ matrix.os }}-${{ matrix.go }}.json'
          --
          -race
          -p 2
          -count 1
          -timeout=30m
          -coverprofile='unit.coverage.${{ matrix.os }}-${{ matrix.go }}.out'
          -covermode=atomic
          -coverpkg="$(go list)"/... ${EXTRA_FLAGS}
          ./...
      -
        name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # *.coverage.* pattern is automatically detected by codecov
          path: '**/*.coverage.*.out'
          name: 'unit.coverage.${{ matrix.os }}-${{ matrix.go }}'
          retention-days: 1
      -
        name: Upload test report artifacts
        # upload report even if tests fail. BTW, this is when they are valuable.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: '**/unit.report.*.json'
          name: 'unit.report.${{ matrix.os }}-${{ matrix.go }}'
          retention-days: 1

  fuzz-test:
    # fuzz-test supports go monorepos
    needs: [changes]
    if: ${{ needs.changes.outputs.changed == 'true' }}
    uses: ./.github/workflows/fuzz-test.yml

  test-complete:
    # description: |
    #   Be explicit about all tests being passed. This allows for setting up only a few status checks on PRs.
    #
    #   This is the gate: it is the one job callers pin in their branch protection rules, so it
    #   MUST report on every run, including the runs where everything else was skipped.
    #
    #   Hence "always()" -- with the default condition the job would inherit the skip of its
    #   dependencies and never report, which is the very hole we are closing -- and an assertion
    #   on the negative: fail on 'failure' and 'cancelled', pass on 'skipped'. A job correctly
    #   skipped is then indistinguishable from a job that had nothing to do.
    #
    #   Every job belongs in "needs", "changes" included: a job skipped because ITS dependency
    #   failed reports 'skipped', so leaving the failing one out would turn the gate green over
    #   an untested pull request.
    name: tests completed
    needs: [changes, lint, test, fuzz-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      -
        name: Report upstream job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "::group::upstream job results"
          printenv RESULTS
          echo "::endgroup::"
      -
        name: Fail on any unsuccessful upstream job
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error title=tests::at least one job failed or was cancelled"
          exit 1
      -
        name: Tests completed
        run: |
          echo "::notice title=Success::All tests passed"

  collect-coverage:
    # Guarded on the tests themselves: "tests completed" is now green on runs where the
    # matrix never ran, and there would be no coverage artifact to collect.
    needs: [test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    uses: ./.github/workflows/collect-coverage.yml

  collect-reports:
    needs: [test]
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    uses: ./.github/workflows/collect-reports.yml
