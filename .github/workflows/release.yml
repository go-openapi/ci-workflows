name: Release

permissions:
  contents: read

# description: |
#   Build a github release on either pushed tag or a manual workflow call.
#
#   By default, the only available asset is a release note.
#
#   When goreleaser is enabled, the release notes are handed over to goreleaser,
#   which builds the release assets and publishes the github release itself.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      is-monorepo:
        type: string
        required: false
        default: 'false'
        description: 'Set to true for mono-repo projects to generate per-module release notes'
      cliff-config:
        type: string
        required: false
        default: '.cliff.toml'
        description: 'Path to the git-cliff config file in the caller repository'
      cliff-config-url:
        type: string
        required: false
        default: 'https://raw.githubusercontent.com/go-openapi/ci-workflows/refs/heads/master/.cliff.toml'
        description: 'URL to the remote git-cliff config file (used if local config does not exist)'
      monorepo-cliff-template:
        type: string
        required: false
        default: '.cliff-monorepo.toml'
        description: 'Path to the git-cliff template used to generate module-specific release notes'
      monorepo-cliff-template-url:
        type: string
        required: false
        default: https://raw.githubusercontent.com/go-openapi/ci-workflows/refs/heads/master/.cliff-monorepo.toml
        description: 'URL to the remote git-cliff template used to generate module-specific release notes'
      enable-goreleaser:
        type: string
        required: false
        default: 'false'
        description: |
          Enable goreleaser to build the release assets.

          When enabled, this workflow prepares the release notes as usual, then hands them over to
          goreleaser, which builds the assets and publishes the github release.

          The caller repository must provide its own goreleaser config (see goreleaser-config).
      goreleaser-config:
        type: string
        required: false
        default: '.goreleaser.yml'
        description: 'Path to the goreleaser config file in the caller repository'
      goreleaser-version:
        type: string
        required: false
        default: '~> v2'
        description: 'Version constraint for the goreleaser distribution to install'
      goreleaser-args:
        type: string
        required: false
        default: 'release --clean --fail-fast'
        description: |
          Arguments passed to goreleaser.

          The --config and --release-notes flags are appended by this workflow.
      goreleaser-env:
        type: string
        required: false
        default: ''
        description: |
          Additional non-secret environment for goreleaser, as newline-separated KEY=VALUE pairs.

          Secrets must never be passed here: use the dedicated secrets of this workflow instead.
      enable-artifact-signing:
        type: string
        required: false
        default: 'true'
        description: |
          Import the bot PGP key before running goreleaser, so that a "signs" section
          in the goreleaser config may sign the release assets.

          When enabled, you must pass the GPG secrets to this workflow.
      enable-upx:
        type: string
        required: false
        default: 'false'
        description: |
          Install the UPX executable packer before running goreleaser.

          Required by goreleaser configs which declare an "upx" section.
    secrets:
      gpg-private-key:
        description: |
          GPG private key in armored format for signing release assets.

          Default for go-openapi: CI_BOT_GPG_PRIVATE_KEY

          Required when enable-artifact-signing is true.
        required: false
      gpg-passphrase:
        description: |
          Passphrase to unlock the GPG private key.

          Default for go-openapi: CI_BOT_GPG_PASSPHRASE

          Exposed to goreleaser as GPG_PASSPHRASE.
        required: false
      gpg-fingerprint:
        description: |
          Fingerprint of the GPG signing key (spaces removed).

          Default for go-openapi: CI_BOT_SIGNING_KEY

          Exposed to goreleaser as GPG_FINGERPRINT.
        required: false
      nfpm-gpg-private-key:
        description: |
          Standalone RSA private key in armored format, to sign deb and rpm packages.

          Default for go-openapi: GPG_NFPM_KEY

          Exposed to goreleaser as GPG_NFPM_KEY_FILE, which holds the path to the key file.
          Optional: only needed by goreleaser configs which declare a signed "nfpms" section.
        required: false
      discord-webhook-id:
        description: |
          ID of the discord webhook used to announce a release.

          Default for go-openapi: DISCORD_WEBHOOK_ID

          Optional: only needed by goreleaser configs which announce on discord.
        required: false
      discord-webhook-token:
        description: |
          Token of the discord webhook used to announce a release.

          Default for go-openapi: DISCORD_WEBHOOK_TOKEN

          Optional: only needed by goreleaser configs which announce on discord.
        required: false

jobs:
  gh-release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      -
        name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          fetch-tags: true
      -
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: '**/go.sum'
      -
        name: Check goreleaser config [goreleaser]
        # Fail before spending time on the release notes: a missing config is a caller mistake.
        if: ${{ inputs.enable-goreleaser == 'true' }}
        env:
          GORELEASER_CONFIG: ${{ inputs.goreleaser-config }}
        run: |
          if [[ ! -f "${GORELEASER_CONFIG}" ]] ; then
            echo "::error title=goreleaser::goreleaser is enabled but the config file '${GORELEASER_CONFIG}' is not in this repository"
            exit 1
          fi

          echo "::notice title=goreleaser::Using goreleaser config '${GORELEASER_CONFIG}'"
      -
        name: Extract tag message
        id: get-message
        # The tag message is not retrieved unless we fetch the ref explicitly.
        # This step actually only requires depth=1, but subsequent steps consume the full history.
        # We ensure that we get a complete unshallowed history for subsequent steps.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -x

          git fetch --unshallow origin 2>/dev/null || true
          git fetch origin +refs/tags/*:refs/tags/*
          MESSAGE=$(git tag -l "${INPUT_TAG}" --format='%(contents:subject)

          %(contents:body)
          ')
          export MESSAGE
          {
            echo "message<<EOF"
            printenv MESSAGE
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

          echo "Message in git tag ${INPUT_TAG}"
          echo "$MESSAGE"
      -
        name: Detect go mono-repo
        if: ${{ inputs.is-monorepo == 'true' }}
        id: detect-monorepo
        uses: go-openapi/gh-actions/ci-jobs/detect-go-monorepo@768e1ac7e37ab6586242b03a8023615dfc8da6a2 # v1.4.17
      -
        name: Install git-cliff
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: git-cliff
      -
        name: Check for local cliff config
        id: check-config
        env:
          INPUT_CLIFF_CONFIG: ${{ inputs.cliff-config }}
          INPUT_IS_MONOREPO: ${{ inputs.is-monorepo }}
          INPUT_MONOREPO_CLIFF_TEMPLATE: ${{ inputs.monorepo-cliff-template }}
        run: |
          if [[ -f "${INPUT_CLIFF_CONFIG}" ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "::notice title=release::Local config file '${INPUT_CLIFF_CONFIG}' found"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=release::Local config file '${INPUT_CLIFF_CONFIG}' not found, will use remote config"
          fi

          if [[ "${INPUT_IS_MONOREPO}" == "true" && -f "${INPUT_MONOREPO_CLIFF_TEMPLATE}" ]]; then
            echo "monorepo-template-exists=true" >> "${GITHUB_OUTPUT}"
            echo "::notice title=release::Local monorepo config file '${INPUT_MONOREPO_CLIFF_TEMPLATE}' found"
          else
            echo "monorepo-template-exists=false" >> "${GITHUB_OUTPUT}"
            if [[ "${INPUT_IS_MONOREPO}" == "true" ]]; then
              echo "::notice title=release::Local monorepo config file '${INPUT_MONOREPO_CLIFF_TEMPLATE}' not found, will use remote config"
            else
              echo "::notice title=release::Local monorepo config file not needed"
            fi
          fi
      -
        name: Fetch remote cliff-monorepo template [monorepo]
        if: ${{ inputs.is-monorepo == 'true' && steps.check-config.outputs.monorepo-template-exists != 'true' }}
        env:
          MONOREPO_TEMPLATE_URL: ${{ inputs.monorepo-cliff-template-url }}
        run: |
          # Fetch the monorepo template from remote
          LOCAL_TEMPLATE_LOCATION="${RUNNER_TEMP:-/tmp}/.cliff-monorepo.toml"

          echo "::notice title=fetch-template::Fetching monorepo template from ${MONOREPO_TEMPLATE_URL}"
          curl -fsSL "${MONOREPO_TEMPLATE_URL}" -o "${LOCAL_TEMPLATE_LOCATION}"

          echo "::notice title=fetch-template::Monorepo template downloaded to ${LOCAL_TEMPLATE_LOCATION}"
      -
        name: Generate release notes [monorepo]
        if: ${{ inputs.is-monorepo == 'true' }}
        id: notes-monorepo
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TAG_MESSAGE: ${{ steps.get-message.outputs.message }}
          CLIFF_CONFIG: ${{ inputs.cliff-config }}
          CLIFF_CONFIG_URL: ${{ inputs.cliff-config-url }}
          CONFIG_EXISTS: ${{ steps.check-config.outputs.exists }}
          MONOREPO_TEMPLATE_EXISTS: ${{ steps.check-config.outputs.monorepo-template-exists }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          MODULE_RELATIVE_NAMES: ${{ steps.detect-monorepo.outputs.bash-relative-names }}
          MODULE_PATHS: ${{ steps.detect-monorepo.outputs.bash-paths }}
          ROOT_MODULE: ${{ steps.detect-monorepo.outputs.root-module }}
          INPUT_MONOREPO_CLIFF_TEMPLATE: ${{ inputs.monorepo-cliff-template }}
        run: |
          set -euo pipefail
          set -x

          LOCAL_TEMPLATE_LOCATION="${RUNNER_TEMP:-/tmp}/.cliff-monorepo.toml"
          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release-notes.md"
          ROOT_MODULE=$(echo "${ROOT_MODULE}"|sed -E 's/\/v[0-9]+$//')

          root_dir="$(git rev-parse --show-toplevel)"
          cd "${root_dir}"

          # Determine config path
          if [[ "${CONFIG_EXISTS}" == "true" ]] ; then
            cliff_config_flag="--config $(realpath "${CLIFF_CONFIG}")"
          else
            cliff_config_flag="--config-url ${CLIFF_CONFIG_URL}"
          fi
          
          # Determine monorepo template path
          if [[ "${MONOREPO_TEMPLATE_EXISTS}" == "true" ]] ; then
            cliff_monorepo=$(realpath "${INPUT_MONOREPO_CLIFF_TEMPLATE}")
          else
            cliff_monorepo="${LOCAL_TEMPLATE_LOCATION}"
          fi

          # Load monorepo template body
          body_monorepo_template=$(cat "${cliff_monorepo}")

          # Semver pattern for tag filtering
          semver_pattern="v\d+\.\d+\.\d+"

          # Build module arrays
          declare -a ALL_RELATIVE_MODULES
          mapfile -d' ' -t ALL_RELATIVE_MODULES < <(printf "%s" "${MODULE_RELATIVE_NAMES}")

          # Build absolute paths array
          declare -a ALL_FOLDERS
          mapfile -d' ' -t ALL_FOLDERS < <(printf "%s" "${MODULE_PATHS}")

          # Function to find child modules for exclusion (paths relative to repo root)
          function other_module_paths() {
            local current_index="$1"
            local current_module_path="$2"
            declare -a result

            for (( i=0; i<${#ALL_FOLDERS[@]}; i++ )); do
              [[ $i -le $current_index ]] && continue

              folder="${ALL_FOLDERS[$i]}"
              [[ "${folder}" == "${current_module_path}" ]] && continue

              # Check if folder is a child of current module
              if [[ "${folder}" =~ ^"${current_module_path}" ]] ; then
                relative_folder="${folder#${root_dir}/}"
                result+=("--exclude-path ${relative_folder}/**")
              fi
            done

            echo "${result[@]}"
          }

          # Create temp directory for module notes
          tmp_dir="${RUNNER_TEMP:-/tmp}/release-notes"
          rm -rf "${tmp_dir}"
          mkdir -p "${tmp_dir}"

          # Generate module-specific notes (Part 2)
          for (( i=0; i<${#ALL_RELATIVE_MODULES[@]}; i++ )); do
            folder="${ALL_FOLDERS[$i]}"

            # Derive relative folder path from repo root (filesystem-based, not module-name-based).
            # This avoids issues when GITHUB_REPO (fork) differs from the go module path (upstream).
            relative_folder="${folder#${root_dir}/}"
            if [[ "${relative_folder}" == "${folder}" || -z "${relative_folder}" ]] ; then
              # Root module is already covered by Part 1 (full changelog)
              echo "::notice title=module-notes::Skipping root module (covered by full changelog)"
              continue
            fi

            module_name="${relative_folder}"

            # Build exclusion list for child modules
            excluded=$(other_module_paths "${i}" "${folder}")

            # All modules use the root tag pattern for consistent version range resolution.
            # Non-root modules use --include-path to scope commits to their directory.
            # This avoids requiring per-module tags to exist for the previous release.
            tag_pattern="^${semver_pattern}$"
            include_path_flag="--include-path ${relative_folder}/**"

            echo "::notice title=module-notes::Generating notes for module: ${module_name}"

            # shellcheck disable=SC2086 # we want optional flags to expand
            # Disable glob expansion so --include-path and --exclude-path
            # glob patterns (e.g., codegen/**) are passed literally to git-cliff.
            set -f
            module_output=$(git-cliff \
                ${cliff_config_flag} \
                --body "${body_monorepo_template}" \
                --tag-pattern "${tag_pattern}" \
                --tag "${RELEASE_TAG}" \
                ${include_path_flag} \
                ${excluded} \
                --strip all \
                --latest \
                --with-tag-message "")
            set +f

            # Skip modules with no commits in this release
            if [[ -z "$(echo "${module_output}" | sed '/^[[:space:]]*$/d')" ]] ; then
              echo "::notice title=module-notes::Skipping module with no commits: ${module_name}"
              continue
            fi

            notes="${tmp_dir}/notes-$(echo "${module_name}" | tr '/' '-').md"

            {
              echo ""
              echo "---"
              echo ""
              echo "## ${module_name} (${RELEASE_TAG#v})"
              echo ""
              echo "${module_output}"
              echo ""
            } > "${notes}"
          done

          # Generate full changelog (Part 1)
          echo "::notice title=full-changelog::Generating full changelog with global sections"

          tag_pattern="^${semver_pattern}$"

          FULL_NOTES=$(git-cliff \
              ${cliff_config_flag} \
              --tag-pattern "${tag_pattern}" \
              --latest \
              --with-tag-message "${TAG_MESSAGE}")

          # Assemble final release notes (Part 1 + Part 2)
          {
            echo "${FULL_NOTES}"
            echo ""
            echo "# Per-module changes"
            echo ""
            cat "${tmp_dir}"/notes-*.md
          } > "${NOTES_FILE}"

          # Log notes
          cat "${NOTES_FILE}"

          # Cleanup
          rm -rf "${tmp_dir}"

          echo "::notice title=release-notes::Generated two-part release notes for mono-repo"
      -
        name: Generate release notes
        if: ${{ inputs.is-monorepo != 'true' }}
        id: notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          TAG_MESSAGE: ${{ steps.get-message.outputs.message }}
          CONFIG_EXISTS: ${{ steps.check-config.outputs.exists }}
          CLIFF_CONFIG: ${{ inputs.cliff-config }}
          CLIFF_CONFIG_URL: ${{ inputs.cliff-config-url }}
        run: |
          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release-notes.md"

          if [[ "${CONFIG_EXISTS}" == "true" ]] ; then
            cliff_config_flag="--config ${CLIFF_CONFIG}"
          else
            cliff_config_flag="--config-url ${CLIFF_CONFIG_URL}"
          fi

          # shellcheck disable=SC2086 # we want the config flag to expand
          git-cliff \
              ${cliff_config_flag} \
              --latest \
              --with-tag-message "${TAG_MESSAGE}" \
              --output "${NOTES_FILE}"

          # Log notes
          cat "${NOTES_FILE}"
      -
        name: Configure bot credentials [goreleaser]
        if: ${{ inputs.enable-goreleaser == 'true' && inputs.enable-artifact-signing == 'true' }}
        uses: go-openapi/gh-actions/ci-jobs/bot-credentials@768e1ac7e37ab6586242b03a8023615dfc8da6a2 # v1.4.17
        # This is using the GPG signature of bot-go-openapi.
        #
        # For go-openapi repos (using secrets: inherit):
        #   Falls back to: CI_BOT_GPG_PRIVATE_KEY, CI_BOT_GPG_PASSPHRASE, CI_BOT_SIGNING_KEY
        #
        # For other orgs: explicitly pass secrets with your custom names
        #
        # The key is only imported into the keyring: goreleaser signs the assets, git signs nothing here.
        with:
          enable-gpg-signing: 'true'
          gpg-private-key: ${{ secrets.gpg-private-key || secrets.CI_BOT_GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.gpg-passphrase || secrets.CI_BOT_GPG_PASSPHRASE }}
          gpg-fingerprint: ${{ secrets.gpg-fingerprint || secrets.CI_BOT_SIGNING_KEY }}
          enable-tag-signing: 'false'
          enable-commit-signing: 'false'
      -
        name: Write nfpm signing key [goreleaser]
        if: ${{ inputs.enable-goreleaser == 'true' }}
        id: nfpm-key
        env:
          NFPM_GPG_KEY: ${{ secrets.nfpm-gpg-private-key || secrets.GPG_NFPM_KEY }}
        run: |
          # nfpm uses go's openpgp library, which handles neither DSA keys nor subkey-only exports.
          # Signing deb and rpm packages therefore requires a standalone RSA key, distinct from the
          # key used to sign the other release assets.
          if [[ -z "${NFPM_GPG_KEY}" ]] ; then
            echo "::notice title=goreleaser::No nfpm signing key provided. Skipped."
            exit 0
          fi

          NFPM_KEY_FILE="$(mktemp -t gpg-nfpm-key-XXXXXX.asc)"
          printenv NFPM_GPG_KEY > "${NFPM_KEY_FILE}"
          echo "path=${NFPM_KEY_FILE}" >> "${GITHUB_OUTPUT}"

          echo "::notice title=goreleaser::nfpm signing key written to ${NFPM_KEY_FILE}"
      -
        name: Install UPX [goreleaser]
        if: ${{ inputs.enable-goreleaser == 'true' && inputs.enable-upx == 'true' }}
        uses: crazy-max/ghaction-upx@c83f378efc804f828e988debb88ed6116feb2368 # v4.0.0
        with:
          install-only: true
      -
        name: Export additional environment [goreleaser]
        if: ${{ inputs.enable-goreleaser == 'true' && inputs.goreleaser-env != '' }}
        env:
          GORELEASER_ENV: ${{ inputs.goreleaser-env }}
        run: |
          # Non-secret KEY=VALUE pairs, one per line, forwarded to the goreleaser step.
          while IFS= read -r line ; do
            [[ -z "${line}" || "${line}" =~ ^[[:space:]]*# ]] && continue

            if [[ ! "${line}" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]] ; then
              echo "::error title=goreleaser::Invalid entry in goreleaser-env: '${line}'. Expected KEY=VALUE"
              exit 1
            fi

            echo "${line}" >> "${GITHUB_ENV}"
            echo "::notice title=goreleaser::Exported ${line%%=*}"
          done <<< "${GORELEASER_ENV}"
      -
        name: Build and publish release [goreleaser]
        if: ${{ inputs.enable-goreleaser == 'true' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ inputs.goreleaser-version }}
          args: ${{ inputs.goreleaser-args }} --config ${{ inputs.goreleaser-config }} --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The release tag is authoritative. Mono-repo releases push several tags on the same commit
          # (e.g. v0.6.0 and codegen/v0.6.0): left to itself, goreleaser would resolve an arbitrary one.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          GPG_PASSPHRASE: ${{ secrets.gpg-passphrase || secrets.CI_BOT_GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ secrets.gpg-fingerprint || secrets.CI_BOT_SIGNING_KEY }}
          GPG_NFPM_KEY_FILE: ${{ steps.nfpm-key.outputs.path }}
          DISCORD_WEBHOOK_ID: ${{ secrets.discord-webhook-id || secrets.DISCORD_WEBHOOK_ID }}
          DISCORD_WEBHOOK_TOKEN: ${{ secrets.discord-webhook-token || secrets.DISCORD_WEBHOOK_TOKEN }}
      -
        name: Create github release
        # When goreleaser is enabled, it publishes the release itself.
        if: ${{ inputs.enable-goreleaser != 'true' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          tag_name: ${{ inputs.tag }}
          generate_release_notes: false # skip auto-generated release notes from github API
